<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- stylesheet-css -->
     <link rel="stylesheet" href="css/style.css">

     <!-- bootstrap-css -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

</head>
<body>

    <div class="bg">
        <div class="story">
                <div class="headng-algn">
                    <h1>signup</h1>
                    <button onclick="back(event)" class="circle"><i class="fa-solid fa-arrow-left"></i></button>
                </div>
                <form action="" onsubmit="signup(event)" class="bdr">
                    <div>
                        <label for="name" class="spce">Name:</label>
                        <input type="text" id="name" placeholder="enter name here..." class="form-space">
                    </div><br>
                    <div>
                        <label for="email" class="spce">Email:</label>
                        <input type="email" id="email" placeholder="enter email here..." class="form-space">
                    </div><br>
                    <div>
                        <label for="password" class="spce">Password:</label>
                        <input type="password" id="password" placeholder="enter password here..." class="form-space">
                    </div><br>
                    <button type="submit">signup</button>
                </form>
        </div>
    </div>
    


    <script src="script.js"></script>
</body>
</html>
